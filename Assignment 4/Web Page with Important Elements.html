<!DOCTYPE html>
<html>
<head>

    <!-- Specifies the title shown on the browser tab -->
    <title>Head Elements Example</title>

    <!-- Defines the character encoding -->
    <meta charset="UTF-8">

    <!-- Provides a description of the webpage -->
    <meta name="description" content="Example of important head elements">

    <!-- Specifies the author of the webpage -->
    <meta name="author" content="Harshit Krishna Verma">

    <!-- Sets a base URL for all relative links -->
    <base href="https://example.com/">

    <!-- Links an external resource such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- Internal CSS styles -->
    <style>

    </style>

    <!-- JavaScript code -->
    <script>

    </script>

</head>

<body>

<h2>Important Head Elements Demo</h2>

<p>
This page demonstrates the use of title, meta, base,
link, style, and script tags inside the head section.
</p>

</body>
</html>
