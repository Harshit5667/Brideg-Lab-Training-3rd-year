<!DOCTYPE html>
<html>
<head>
    <title>Google Map</title>
</head>
<body>

    <h2>My City Location</h2>

    <!-- loading="lazy" delays loading of the map until it is needed, improving page performance -->

    <iframe
        src="https://www.google.com/maps?q=Delhi&output=embed"
        title="Google Map"
        width="80%"
        height="400"
        loading="lazy">
    </iframe>

</body>
</html>
