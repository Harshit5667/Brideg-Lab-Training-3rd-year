<!DOCTYPE html>
<html>
<head>
    <title>Secure Form</title>
</head>
<body>

<h2>Secure User Form</h2>

<form autocomplete="off">

    Full Name:
    <input type="text" name="fullname" required>
    <br><br>

    Email:
    <input type="email" name="email" required>
    <br><br>

    Password:
    <input type="password" name="password" required>
    <br><br>

    <input type="submit" value="Submit">

</form>

<p>
Note: Turning off autocomplete can improve security by
preventing browsers from storing and automatically filling
sensitive information such as usernames, passwords, and
personal details on shared or public computers.
</p>

</body>
</html>
