<!DOCTYPE html>
<html>
<head>
    <title>Student Information Form</title>
</head>
<body>

<h2>Student Information</h2>

<form>

    Name:
    <input type="text" name="name">
    <br><br>

    Roll Number:
    <input type="text" name="rollno">
    <br><br>

    Course:
    <select name="course">
        <option value="" disabled selected>
            Select Course
        </option>
        <option>CSE</option>
        <option>IT</option>
        <option>ECE</option>
        <option>Mechanical</option>
    </select>

    <br><br>

    <input type="submit" value="Submit">

</form>

</body>
</html>
